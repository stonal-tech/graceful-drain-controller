apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "graceful-drain-controller.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "graceful-drain-controller.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "graceful-drain-controller.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "graceful-drain-controller.selectorLabels" . | nindent 8 }}
    spec:
      priorityClassName: system-cluster-critical
      serviceAccountName: {{ include "graceful-drain-controller.fullname" . }}
      containers:
        - name: controller
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --port={{ .Values.port }}
            - --webhook-port={{ .Values.webhookPort }}
            - --cert-dir=/tmp/k8s-webhook-server/serving-certs
            - --log-level={{ .Values.logLevel }}
            {{- if .Values.enabledAnnotation }}
            - --enabled-annotation={{ .Values.enabledAnnotation }}
            {{- end }}
            {{- if .Values.rolloutTimeout }}
            - --rollout-timeout={{ .Values.rolloutTimeout }}
            {{- end }}
            {{- if .Values.requeueInterval }}
            - --requeue-interval={{ .Values.requeueInterval }}
            {{- end }}
          ports:
            - name: health
              containerPort: {{ .Values.port }}
              protocol: TCP
            - name: webhook
              containerPort: {{ .Values.webhookPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: cert
              mountPath: /tmp/k8s-webhook-server/serving-certs
              readOnly: true
      volumes:
        - name: cert
          secret:
            secretName: {{ include "graceful-drain-controller.fullname" . }}-cert
