apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "graceful-drain-controller.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "graceful-drain-controller.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "graceful-drain-controller.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "graceful-drain-controller.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "graceful-drain-controller.fullname" . }}
      containers:
        - name: controller
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --port={{ .Values.port }}
            - --log-level={{ .Values.logLevel }}
            - --drain-taint={{ include "graceful-drain-controller.drainTaints" . }}
            {{- if .Values.enabledAnnotation }}
            - --enabled-annotation={{ .Values.enabledAnnotation }}
            {{- end }}
          ports:
            - name: health
              containerPort: {{ .Values.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
