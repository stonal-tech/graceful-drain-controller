apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ include "graceful-drain-controller.fullname" . }}
  {{- if .Values.certManager.enabled }}
  annotations:
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/{{ include "graceful-drain-controller.fullname" . }}-cert
  {{- end }}
  labels:
    {{- include "graceful-drain-controller.labels" . | nindent 4 }}
webhooks:
- name: eviction.graceful-drain.stonal.com
  rules:
  - apiGroups:   [""]
    apiVersions: ["v1"]
    operations:  ["CREATE"]
    resources:   ["pods/eviction"]
    scope:       "Namespaced"
  clientConfig:
    {{- if and (not .Values.certManager.enabled) .Values.tls.caBundle }}
    caBundle: {{ .Values.tls.caBundle }}
    {{- end }}
    service:
      namespace: {{ .Release.Namespace }}
      name: {{ include "graceful-drain-controller.fullname" . }}
      path: /validate-eviction
      port: {{ .Values.webhookPort }}
  admissionReviewVersions: ["v1"]
  sideEffects: NoneOnDryRun
  failurePolicy: {{ .Values.webhook.failurePolicy }}
  timeoutSeconds: {{ .Values.webhook.timeoutSeconds }}
  {{- with .Values.webhook.namespaceSelector }}
  namespaceSelector:
    {{- toYaml . | nindent 4 }}
  {{- end }}
