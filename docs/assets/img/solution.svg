<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="880" height="480" role="img" aria-label="The controller holds the eviction open until a surge pod is Ready on a healthy node, so the replica count goes from one to two and back to one, never reaching zero.">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7c3aed"/>
    </marker>
  </defs>
  <style>
    .t    { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .h1   { font-size: 17px; font-weight: 700; fill: #0f172a; }
    .h2   { font-size: 13px; font-weight: 700; fill: #0f172a; }
    .sub  { font-size: 12px; fill: #64748b; }
    .ax   { font-size: 11px; fill: #94a3b8; }
    .lbl  { font-size: 11px; font-weight: 600; }
    .pill { font-size: 12px; font-weight: 700; }
    .chip { font-size: 12px; font-weight: 600; }
  </style>
  <rect x="0" y="0" width="880" height="480" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text class="t h1"  x="32" y="44">What graceful-drain-controller does</text>
  <text class="t sub" x="32" y="64">It holds the eviction open just long enough for a replacement pod to come up somewhere else.</text>

  <!-- ================= node view ================= -->
  <!-- node A -->
  <rect x="32" y="88" width="352" height="118" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="32" y="88" width="352" height="28" rx="10" fill="#fef3c7"/>
  <rect x="32" y="106" width="352" height="10" fill="#fef3c7"/>
  <text class="t h2" x="52" y="107" fill="#92400e">node-a — tainted, draining</text>
  <rect x="52" y="132" width="150" height="34" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <circle cx="70" cy="149" r="5" fill="#2563eb"/>
  <text class="t mono chip" x="84" y="153" fill="#1e40af">app-7f9b · v1</text>
  <text class="t sub" x="52" y="188">evicted only once the new pod is Ready</text>

  <!-- arrow -->
  <path d="M396 147 H484" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#ar)" fill="none"/>
  <text class="t lbl" x="440" y="138" text-anchor="middle" fill="#7c3aed">surge pod</text>

  <!-- node B -->
  <rect x="496" y="88" width="352" height="118" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="496" y="88" width="352" height="28" rx="10" fill="#dcfce7"/>
  <rect x="496" y="106" width="352" height="10" fill="#dcfce7"/>
  <text class="t h2" x="516" y="107" fill="#166534">node-b — healthy</text>
  <rect x="516" y="132" width="150" height="34" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
  <circle cx="534" cy="149" r="5" fill="#16a34a"/>
  <text class="t mono chip" x="548" y="153" fill="#166534">app-2c4d · v2</text>
  <text class="t sub" x="516" y="188">scheduled here — node-a is NoSchedule</text>

  <!-- ================= timeline ================= -->
  <rect x="32" y="226" width="816" height="222" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <text class="t h2" x="56" y="256">Ready pods over time</text>

  <line x1="96" y1="380" x2="820" y2="380" stroke="#cbd5e1"/>
  <line x1="96" y1="288" x2="96"  y2="380" stroke="#cbd5e1"/>
  <text class="t ax" x="88" y="384" text-anchor="end">0</text>
  <text class="t ax" x="88" y="340" text-anchor="end">1</text>
  <text class="t ax" x="88" y="296" text-anchor="end">2</text>
  <line x1="92" y1="336" x2="96" y2="336" stroke="#cbd5e1"/>
  <line x1="92" y1="292" x2="96" y2="292" stroke="#cbd5e1"/>

  <!-- surge window -->
  <rect x="400" y="288" width="220" height="92" fill="#16a34a" fill-opacity="0.07"/>

  <!-- event markers -->
  <line x1="248" y1="282" x2="248" y2="388" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="400" y1="282" x2="400" y2="388" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="620" y1="282" x2="620" y2="388" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3"/>

  <!-- step line 1 -> 2 -> 1 -->
  <path d="M96 336 H400 V292 H620 V336 H820" fill="none" stroke="#16a34a" stroke-width="3" stroke-linejoin="round"/>

  <!-- never zero -->
  <path d="M96 380 H820" fill="none" stroke="#dc2626" stroke-width="1" stroke-dasharray="3 4" opacity="0.5"/>
  <text class="t lbl" x="820" y="374" text-anchor="end" fill="#dc2626" opacity="0.7">never reached</text>

  <text class="t lbl" x="510" y="278" text-anchor="middle" fill="#166534">2 pods ready — PDB and webhook both satisfied</text>

  <text class="t ax" x="248" y="404" text-anchor="middle">eviction requested</text>
  <text class="t ax" x="248" y="418" text-anchor="middle">webhook denies (429)</text>
  <text class="t ax" x="400" y="404" text-anchor="middle">surge pod Ready</text>
  <text class="t ax" x="620" y="404" text-anchor="middle">retry allowed</text>
  <text class="t ax" x="620" y="418" text-anchor="middle">old pod evicted</text>

  <rect x="644" y="242" width="180" height="26" rx="13" fill="#dcfce7"/>
  <circle cx="660" cy="255" r="4" fill="#16a34a"/>
  <text class="t pill" x="672" y="259" fill="#166534">Zero disruption</text>
</svg>
